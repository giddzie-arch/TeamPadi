name: project-api

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: project_api_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - project_api_net

  client:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: project_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./project-client:/app
      - /app/node_modules
    networks:
      - project_api_net
    depends_on:
      - web

  web:
    image: nginx:alpine
    container_name: project_api_web
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - project_api_net

  db:
    image: mysql:8.0
    container_name: project_api_db
    restart: unless-stopped
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: project_api
      MYSQL_USER: project_user
      MYSQL_PASSWORD: project_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - project_api_net

networks:
  project_api_net:
    driver: bridge

volumes:
  db_data:
    driver: local


